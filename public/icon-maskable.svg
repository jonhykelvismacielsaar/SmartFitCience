<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SmartFit Science">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1024"/><stop offset="0.55" stop-color="#070b18"/><stop offset="1" stop-color="#04121a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ef3c0"/><stop offset="1" stop-color="#39a0ff"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f4a"/><stop offset="1" stop-color="#ff5f9e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#05070f"/><rect width="512" height="512" fill="url(#bg)"/>
  
  <g transform="translate(51 51) scale(0.8)" filter="url(#glow)">
    <!-- duplo hélice = ciência -->
    <path d="M168 96c86 56 86 128 0 184s-86 128 0 184" fill="none" stroke="url(#neon)" stroke-width="18" stroke-linecap="round" opacity="0.55"/>
    <path d="M256 96c-86 56-86 128 0 184s86 128 0 184" fill="none" stroke="url(#amber)" stroke-width="14" stroke-linecap="round" opacity="0.5"/>
    <!-- barra = treino -->
    <g stroke="url(#neon)" stroke-width="22" stroke-linecap="round">
      <path d="M196 256h120"/>
    </g>
    <g fill="url(#neon)">
      <rect x="150" y="212" width="30" height="88" rx="12"/>
      <rect x="332" y="212" width="30" height="88" rx="12"/>
    </g>
    <!-- garra = nutrição/hidratação -->
    <path d="M256 300c34 40 52 62 52 84a52 52 0 1 1-104 0c0-22 18-44 52-84z" fill="none" stroke="url(#neon)" stroke-width="12" stroke-linejoin="round" opacity="0.9"/>
  </g>
  <circle cx="392" cy="128" r="9" fill="#6ef3c0"/>
  <circle cx="120" cy="392" r="6" fill="#ff5f9e" opacity="0.8"/>
</svg>

